<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Secure Accounts & Ranked</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #160826 0%, #0b0410 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-wrapper {
            position: relative;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #game-container {
            position: relative;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.45), 0 15px 35px rgba(0,0,0,0.8);
            border: 2px solid rgba(186, 85, 211, 0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 14px;
        }

        /* Sağ Taraf Taşıyıcısı (Skor Tablosu + Mağaza Butonu) */
        #sidebar-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 260px;
        }

        /* Liderlik Tablosu Paneli */
        #leaderboard {
            width: 100%;
            background: rgba(22, 8, 38, 0.85);
            border: 2px solid rgba(186, 85, 211, 0.3);
            border-radius: 16px;
            padding: 15px;
            color: #fff;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.3);
            display: none;
        }
        #leaderboard h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #d8b4fe;
            text-shadow: 0 0 8px rgba(224, 86, 253, 0.5);
            border-bottom: 1px solid rgba(186, 85, 211, 0.2);
            padding-bottom: 8px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lb-item:last-child {
            border-bottom: none;
        }
        .lb-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            max-width: 170px;
        }
        .lb-nick-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lb-icon {
            font-size: 9px;
            letter-spacing: -1px;
            line-height: 1;
            padding-left: 15px;
        }
        .lb-nick {
            color: #f3a683;
            font-weight: bold;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lb-score-box {
            text-align: right;
        }
        .lb-score {
            font-weight: bold;
            color: #68d391;
            font-size: 14px;
        }

        /* Mağaza Butonu */
        #sidebar-shop-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: 2px solid rgba(186, 85, 211, 0.3);
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
            display: none;
            text-align: center;
        }
        #sidebar-shop-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.5);
        }

        /* Ortak Ekran Stilleri */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 4, 16, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 14px;
            color: #fff;
            padding: 20px;
        }
        .screen h2 {
            color: #d8b4fe;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(224, 86, 253, 0.5);
        }
        .input-field {
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid #a855f7;
            background: #1e0b36;
            color: #fff;
            outline: none;
            text-align: center;
            margin-bottom: 12px;
            width: 80%;
            max-width: 250px;
        }
        .input-field:focus {
            border-color: #e056fd;
            box-shadow: 0 0 10px rgba(224, 86, 253, 0.5);
        }
        .menu-btn {
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #a855f7, #68d391);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            margin: 5px;
            width: 180px;
        }
        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
        }

        #error-msg {
            color: #ff7675;
            font-size: 13px;
            margin-bottom: 10px;
            height: 15px;
        }

        /* Mağaza Paneli */
        #shop-screen {
            display: none;
        }
        .shop-items {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .skin-card {
            background: #1e0b36;
            border: 2px solid #481380;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            width: 90px;
            cursor: pointer;
            transition: 0.2s;
        }
        .skin-card.selected {
            border-color: #68d391;
            box-shadow: 0 0 10px rgba(104, 211, 145, 0.5);
        }
        .skin-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
        }
        #player-coins {
            color: #f1c40f;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- Giriş / Kayıt Ekranı -->
    <div id="nick-screen" class="screen">
        <h2>HESAP GİRİŞİ</h2>
        <div id="error-msg"></div>
        <input type="text" id="nick-input" class="input-field" placeholder="Kullanıcı Adını Giriniz" maxlength="12" autocomplete="off">
        <input type="password" id="pass-input" class="input-field" placeholder="Şifren..." maxlength="16" autocomplete="off">
        <button id="login-btn" class="menu-btn">Giriş Yap / Kayıt Ol</button>
    </div>

    <!-- Oyun İçi Ana Menü -->
    <div id="menu-screen" class="screen" style="display: none;">
        <h2>HOŞ GELDİN, <span id="welcome-nick" style="color:#68d391;"></span></h2>
        <button id="start-game-btn" class="menu-btn">Oyuna Başla</button>
        <button id="open-shop-btn" class="menu-btn" style="background: linear-gradient(135deg, #3498db, #2ecc71);">Mağaza 🛒</button>
        <button id="logout-btn" class="menu-btn" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">Çıkış Yap</button>
    </div>

    <!-- Mağaza Ekranı -->
    <div id="shop-screen" class="screen">
        <h2>MAĞAZA</h2>
        <div id="player-coins">💰 Puanın: <span id="coin-val">0</span></div>
        <div class="shop-items" id="shop-items-container"></div>
        <button id="close-shop-btn" class="menu-btn">Geri Dön</button>
    </div>
    
    <div id="game-container">
        <canvas id="canvas" width="460" height="640"></canvas>
    </div>

    <!-- Sağ Taraf: Skor Tablosu + Mağaza Butonu -->
    <div id="sidebar-container">
        <div id="leaderboard">
            <h3>🏆 En İyi 5 Rekor</h3>
            <div id="lb-list">Yükleniyor...</div>
        </div>
        <button id="sidebar-shop-btn">🛒 Mağaza</button>
    </div>
</div>

<!-- Firebase Entegrasyonu ve Oyun Mantığı -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDdAU6Ie4VQbrUF4U4lmKGriYq6B_aNOgM",
        authDomain: "flappy-ahsen.firebaseapp.com",
        databaseURL: "https://flappy-ahsen-default-rtdb.firebaseio.com",
        projectId: "flappy-ahsen",
        storageBucket: "flappy-ahsen.appspot.com",
        messagingSenderId: "180073031220",
        appId: "1:180073031220:web:eef3f219279d521daab9d9",
        measurementId: "G-K4N9F8PH4C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let playerNick = "";
    let totalCoins = 0;
    let unlockedSkins = ["default"];
    let currentSkin = "default";
    let topScores = [];
    let returningFromShop = false;

    // Oyun İçi Durumlar ve Can/Güçlendirmeler
    let playerLives = 1;         
    let doubleScoreTimer = 0;    
    let hitCooldown = 0;         

    const skins = [
        { id: "default", name: "Mor Kuş", price: 0, color: "#e056fd" },
        { id: "gold", name: "Altın Kuş", price: 25, color: "#f1c40f" },
        { id: "fire", name: "Alev Kuş", price: 50, color: "#e74c3c" }
    ];

    function getRankSymbol(score) {
        if (score < 0) score = 0;
        let tier = Math.floor(score / 20);
        let crowns = Math.floor(tier / 5);
        let stars = tier % 5;

        if (tier > 0 && stars === 0 && crowns > 0) {
            crowns--;
            stars = 5;
        }

        let symbol = "";
        for (let i = 0; i < crowns; i++) symbol += "👑";
        for (let i = 0; i < stars; i++) symbol += "⭐";
        
        return symbol === "" ? "⭐" : symbol;
    }

    let currentRankIcon = "⭐";
    let nextRankIcon = "⭐⭐";
    let progressPercent = 0;

    function updateProgressData(currentScore) {
        let currentTierMin = Math.floor(currentScore / 20) * 20;
        let nextTierMin = currentTierMin + 20;

        let progress = currentScore - currentTierMin;
        progressPercent = Math.min(100, Math.max(0, (progress / 20) * 100));

        currentRankIcon = getRankSymbol(currentScore);
        nextRankIcon = getRankSymbol(nextTierMin);
    }

    // --- GÜVENLİ GİRİŞ / KAYIT KONTROLÜ ---
    document.getElementById("login-btn").addEventListener("click", () => {
        const nick = document.getElementById("nick-input").value.trim();
        const pass = document.getElementById("pass-input").value.trim();
        const errBox = document.getElementById("error-msg");

        if (!nick || !pass) {
            errBox.innerText = "Lütfen kullanıcı adı ve şifre gir!";
            return;
        }

        let savedAccounts = JSON.parse(localStorage.getItem("flappy_accounts") || "{}");

        if (savedAccounts[nick]) {
            // Nick zaten kayıtlıysa, şifrenin doğru olması zorunludur! Başkası ele geçiremez.
            if (savedAccounts[nick].pass === pass) {
                playerNick = nick;
                totalCoins = savedAccounts[nick].coins;
                unlockedSkins = savedAccounts[nick].unlocked;
                currentSkin = savedAccounts[nick].skin;
                openMenu();
            } else {
                errBox.innerText = "Bu kullanıcı adı başkasına ait! Şifre yanlış.";
            }
        } else {
            // Nick daha önce hiç alınmamışsa yeni hesap oluşturulur ve sabitlenir.
            savedAccounts[nick] = { pass: pass, coins: 0, unlocked: ["default"], skin: "default" };
            localStorage.setItem("flappy_accounts", JSON.stringify(savedAccounts));
            playerNick = nick;
            totalCoins = 0;
            unlockedSkins = ["default"];
            currentSkin = "default";
            openMenu();
        }
    });

    function saveAccountData() {
        let savedAccounts = JSON.parse(localStorage.getItem("flappy_accounts") || "{}");
        if (savedAccounts[playerNick]) {
            savedAccounts[playerNick].coins = totalCoins;
            savedAccounts[playerNick].unlocked = unlockedSkins;
            savedAccounts[playerNick].skin = currentSkin;
            localStorage.setItem("flappy_accounts", JSON.stringify(savedAccounts));
        }
    }

    function openMenu() {
        document.getElementById("nick-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "flex";
        document.getElementById("welcome-nick").innerText = playerNick;
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("nick-screen").style.display = "flex";
        document.getElementById("leaderboard").style.display = "none";
        document.getElementById("sidebar-shop-btn").style.display = "none";
        document.getElementById("nick-input").value = "";
        document.getElementById("pass-input").value = "";
        document.getElementById("error-msg").innerText = "";
    });

    document.getElementById("start-game-btn").addEventListener("click", () => {
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("leaderboard").style.display = "block";
        document.getElementById("sidebar-shop-btn").style.display = "block";
        fetchLeaderboard();
        updateProgressData(0);
        gameState = "START";
    });

    function updateShopUI() {
        document.getElementById("coin-val").innerText = totalCoins;
        const container = document.getElementById("shop-items-container");
        container.innerHTML = "";

        skins.forEach(skin => {
            let isUnlocked = unlockedSkins.includes(skin.id);
            let isSelected = currentSkin === skin.id;

            let card = document.createElement("div");
            card.className = `skin-card ${isSelected ? "selected" : ""}`;
            card.innerHTML = `
                <div class="skin-preview" style="background: ${skin.color};"></div>
                <div style="font-size: 12px; font-weight:bold; margin-bottom:5px;">${skin.name}</div>
                <div style="font-size: 11px; color: ${isUnlocked ? '#68d391' : '#f1c40f'};">
                    ${isSelected ? "Seçili" : (isUnlocked ? "Seç" : skin.price + " Puan")}
                </div>
            `;

            card.addEventListener("click", () => {
                if (isUnlocked) {
                    currentSkin = skin.id;
                    saveAccountData();
                    updateShopUI();
                } else {
                    if (totalCoins >= skin.price) {
                        totalCoins -= skin.price;
                        unlockedSkins.push(skin.id);
                        currentSkin = skin.id;
                        saveAccountData();
                        updateShopUI();
                    } else {
                        alert("Yeterli puanın yok!");
                    }
                }
            });
            container.appendChild(card);
        });
    }

    document.getElementById("open-shop-btn").addEventListener("click", () => {
        returningFromShop = false;
        updateShopUI();
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("shop-screen").style.display = "flex";
    });

    document.getElementById("sidebar-shop-btn").addEventListener("click", () => {
        returningFromShop = (gameState === "GAMEOVER" || gameState === "PLAY" || gameState === "START");
        updateShopUI();
        document.getElementById("leaderboard").style.display = "none";
        document.getElementById("sidebar-shop-btn").style.display = "none";
        document.getElementById("shop-screen").style.display = "flex";
    });

    document.getElementById("close-shop-btn").addEventListener("click", () => {
        document.getElementById("shop-screen").style.display = "none";
        if (returningFromShop) {
            document.getElementById("leaderboard").style.display = "block";
            document.getElementById("sidebar-shop-btn").style.display = "block";
        } else {
            document.getElementById("menu-screen").style.display = "flex";
        }
    });

    async function fetchLeaderboard() {
        try {
            const scoresRef = query(ref(db, 'scores'), orderByChild('score'), limitToLast(5));
            const snapshot = await get(scoresRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                topScores = Object.values(data).sort((a, b) => b.score - a.score);
            } else {
                topScores = [];
            }
            updateLeaderboardUI();
        } catch (e) {
            console.log("Firebase skor çekme hatası:", e);
            document.getElementById("lb-list").innerHTML = "<div style='text-align:center; color:#a6b0c3; font-size:13px;'>Bağlantı Bekleniyor</div>";
        }
    }

    function updateLeaderboardUI() {
        const lbList = document.getElementById("lb-list");
        if (topScores.length === 0) {
            lbList.innerHTML = "<div style='text-align:center; color:#a6b0c3; font-size:13px;'>Henüz rekor yok</div>";
            return;
        }
        let html = "";
        topScores.forEach((item, index) => {
            let symbol = getRankSymbol(item.score);
            html += `<div class="lb-item">
                        <div class="lb-left">
                            <div class="lb-nick-row">
                                <span class="lb-nick">${index + 1}. ${item.nick}</span>
                            </div>
                            <span class="lb-icon">${symbol}</span>
                        </div>
                        <div class="lb-score-box">
                            <span class="lb-score">${item.score}</span>
                        </div>
                     </div>`;
        });
        lbList.innerHTML = html;
    }

    async function saveScoreToFirebase(nick, finalScore) {
        if (!nick || finalScore <= 0) return;
        try {
            const newScoreRef = push(ref(db, 'scores'));
            await set(newScoreRef, {
                nick: nick,
                score: finalScore,
                date: Date.now()
            });
            await fetchLeaderboard();
        } catch (e) {
            console.log("Skor kaydetme hatası:", e);
        }
    }

    // --- OYUN KODU ---
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const birdImg = new Image();
    birdImg.src = "resim.png"; 

    const sakayikImg = new Image();
    sakayikImg.src = "Şakayık.png";

    const stars = [];
    for (let i = 0; i < 55; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * (canvas.height - 60),
            size: Math.random() * 2 + 0.5,
            alpha: Math.random()
        });
    }

    let score = 0;
    let gameState = "WAITING_LOGIN"; 
    let scoreSaved = false;
    let elapsedTime = 0;
    let pipeTimer = 0;
    let nextSakayikCount = Math.floor(Math.random() * 4) + 3;
    let freePowerUpTimer = 0; 

    let floatingPowerUps = [];

    const bird = {
        x: 70,
        y: 200,
        w: 36,
        h: 36,
        gravity: 0.38,    
        jump: 8.0,        
        velocity: 0,
        
        draw() {
            ctx.save();
            ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity / 12)));
            ctx.rotate(angle);

            let activeSkinObj = skins.find(s => s.id === currentSkin) || skins[0];

            ctx.save();
            ctx.shadowColor = activeSkinObj.color;
            ctx.shadowBlur = 14;
            ctx.fillStyle = activeSkinObj.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2 + 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2, 0, Math.PI * 2);
            ctx.clip();

            if (birdImg.complete && birdImg.naturalWidth !== 0 && currentSkin === "default") {
                ctx.drawImage(birdImg, -this.w / 2, -this.h / 2, this.w, this.h);
            } else {
                ctx.fillStyle = activeSkinObj.color;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
            ctx.strokeStyle = hitCooldown > 0 ? "#ff4757" : "#f3a683";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        },
        
        update(factor) {
            if (gameState === "PLAY") {
                this.velocity += this.gravity * factor;
                if (this.velocity > 10.0) this.velocity = 10.0;
                this.y += this.velocity * factor;

                if (this.y + this.h >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.h;
                    handleDamage();
                }
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            } else if (gameState === "START") {
                this.y = 200 + Math.sin(elapsedTime * 3) * 10;
                this.velocity = 0;
            }
        },
        
        flap() {
            this.velocity = -this.jump;
        },

        reset() {
            this.y = 200;
            this.velocity = 0;
        }
    };

    function handleDamage() {
        if (hitCooldown > 0) return;

        playerLives--;
        hitCooldown = 1.0; 

        if (playerLives <= 0) {
            gameOver();
        }
    }

    const pipes = {
        position: [],
        w: 72,
        gap: 175,         
        dx: 3.2,          
        spawnInterval: 1.15, 

        draw() {
            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                let topY = p.y;
                let bottomY = p.y + this.gap;

                let pipeGradient = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
                pipeGradient.addColorStop(0, '#2d0a4e');
                pipeGradient.addColorStop(0.5, '#481380');
                pipeGradient.addColorStop(1, '#1a052e');

                ctx.fillStyle = pipeGradient;
                ctx.strokeStyle = "#a29bfe";
                ctx.lineWidth = 2;
                ctx.shadowColor = "#6c5ce7";
                ctx.shadowBlur = 8;

                ctx.fillRect(p.x, 0, this.w, topY);
                ctx.strokeRect(p.x, 0, this.w, topY);
                ctx.fillRect(p.x - 3, topY - 20, this.w + 6, 20);
                ctx.strokeRect(p.x - 3, topY - 20, this.w + 6, 20);

                ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - 50);
                ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - 50);
                ctx.fillRect(p.x - 3, bottomY, this.w + 6, 20);
                ctx.strokeRect(p.x - 3, bottomY, this.w + 6, 20);

                ctx.shadowBlur = 0;

                // Şakayık Çizimi
                if (p.hasSakayik && !p.sakayikCollected) {
                    let sakayikX = p.x + (this.w / 2) - 18;
                    let sakayikY = p.y + (this.gap / 2) - 18;

                    ctx.save();
                    ctx.shadowColor = "#ff7675";
                    ctx.shadowBlur = 12;
                    if (sakayikImg.complete && sakayikImg.naturalWidth !== 0) {
                        ctx.drawImage(sakayikImg, sakayikX, sakayikY, 36, 36);
                    } else {
                        ctx.fillStyle = "#ff7675";
                        ctx.beginPath();
                        ctx.arc(sakayikX + 18, sakayikY + 18, 16, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // Yatay boşluklardaki nadir güçlendiriciler
            for (let i = 0; i < floatingPowerUps.length; i++) {
                let fpu = floatingPowerUps[i];
                if (!fpu.collected) {
                    ctx.save();
                    ctx.shadowColor = fpu.type === '2X' ? "#f1c40f" : "#ff4757";
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = fpu.type === '2X' ? "#f1c40f" : "#ff4757";
                    ctx.beginPath();
                    ctx.arc(fpu.x + 16, fpu.y + 16, 18, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#0b0410";
                    ctx.font = "bold 13px 'Segoe UI', Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    let symbol = fpu.type === '2X' ? "⚡" : "❤️";
                    ctx.fillText(symbol, fpu.x + 16, fpu.y + 17);
                    ctx.restore();
                }
            }
        },

        update(factor, dt) {
            if (gameState !== "PLAY") return;

            if (doubleScoreTimer > 0) doubleScoreTimer -= dt;
            if (hitCooldown > 0) hitCooldown -= dt;

            freePowerUpTimer += dt;
            if (freePowerUpTimer > 20.0) { 
                freePowerUpTimer = 0;
                if (Math.random() < 0.35) {
                    let puType = Math.random() < 0.5 ? '2X' : 'HEART';
                    floatingPowerUps.push({
                        x: canvas.width,
                        y: Math.floor(Math.random() * (canvas.height - 240)) + 70, 
                        type: puType,
                        collected: false
                    });
                }
            }

            let birdRight = bird.x + bird.w;
            let birdBottom = bird.y + bird.h;

            for (let i = 0; i < floatingPowerUps.length; i++) {
                let fpu = floatingPowerUps[i];
                fpu.x -= this.dx * factor;

                if (!fpu.collected) {
                    if (
                        bird.x < fpu.x + 32 &&
                        birdRight > fpu.x &&
                        bird.y < fpu.y + 32 &&
                        birdBottom > fpu.y
                    ) {
                        fpu.collected = true; 
                        if (fpu.type === '2X') {
                            doubleScoreTimer = 20; 
                        } else if (fpu.type === 'HEART') {
                            if (playerLives < 3) playerLives++; 
                        }
                    }
                }

                if (fpu.x + 32 < 0) {
                    floatingPowerUps.splice(i, 1);
                    i--;
                }
            }

            pipeTimer += dt;
            if (pipeTimer > this.spawnInterval) {
                nextSakayikCount--;

                let spawnSakayik = false;
                if (nextSakayikCount <= 0) {
                    spawnSakayik = true;
                    nextSakayikCount = Math.floor(Math.random() * 4) + 3;
                }

                let pipeY = Math.floor(Math.random() * (canvas.height - 280 - this.gap)) + 50;

                this.position.push({
                    x: canvas.width,
                    y: pipeY,
                    passed: false,
                    hasSakayik: spawnSakayik,
                    sakayikCollected: false
                });
                pipeTimer = 0;
            }

            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                p.x -= this.dx * factor;

                let pipeRight = p.x + this.w;
                let pipeBottomGap = p.y + this.gap;

                if (birdRight > p.x && bird.x < pipeRight) {
                    if (bird.y < p.y || birdBottom > pipeBottomGap) {
                        handleDamage();
                    }
                }

                if (p.hasSakayik && !p.sakayikCollected) {
                    let sakayikX = p.x + (this.w / 2) - 18;
                    let sakayikY = p.y + (this.gap / 2) - 18;

                    if (
                        bird.x < sakayikX + 36 &&
                        birdRight > sakayikX &&
                        bird.y < sakayikY + 36 &&
                        birdBottom > sakayikY
                    ) {
                        p.sakayikCollected = true;
                        let pointsToAdd = doubleScoreTimer > 0 ? 2 : 1;
                        score += pointsToAdd;
                        updateProgressData(score);
                    }
                }

                if (p.x + this.w < bird.x && !p.passed) {
                    let pointsToAdd = doubleScoreTimer > 0 ? 2 : 1;
                    score += pointsToAdd;
                    updateProgressData(score);
                    p.passed = true;
                }

                if (p.x + this.w < 0) {
                    this.position.shift();
                    i--;
                }
            }
        },

        reset() {
            this.position = [];
            floatingPowerUps = [];
            pipeTimer = 0;
            freePowerUpTimer = 0;
            nextSakayikCount = Math.floor(Math.random() * 4) + 3;
            doubleScoreTimer = 0;
            playerLives = 1; 
            hitCooldown = 0;
        }
    };

    const ground = {
        draw() {
            ctx.fillStyle = "#0c0517";
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            ctx.fillStyle = "#8e44ad";
            ctx.shadowColor = "#9b59b6";
            ctx.shadowBlur = 10;
            ctx.fillRect(0, canvas.height - 50, canvas.width, 4);
            ctx.shadowBlur = 0;

            if (gameState === "PLAY" || gameState === "START" || gameState === "GAMEOVER") {
                let barX = 30;
                let barY = canvas.height - 35;
                let barW = canvas.width - 60;
                let barH = 16;

                ctx.fillStyle = "#160826";
                ctx.fillRect(barX, barY, barW, barH);
                ctx.strokeStyle = "rgba(186, 85, 211, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(barX, barY, barW, barH);

                let fillW = (barW - 4) * (progressPercent / 100);
                let grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
                grad.addColorStop(0, '#2ecc71');
                grad.addColorStop(1, '#27ae60');
                ctx.fillStyle = grad;
                ctx.fillRect(barX + 2, barY + 2, fillW, barH - 4);

                ctx.font = "10px 'Segoe UI', Arial";
                ctx.fillStyle = "#FFF";
                ctx.textAlign = "right";
                ctx.fillText(currentRankIcon, barX - 4, barY + 13);

                ctx.textAlign = "left";
                ctx.fillText(nextRankIcon, barX + barW + 6, barY + 13);
            }
        }
    };

    function drawBackground() {
        let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#0a0314');
        bgGrad.addColorStop(0.6, '#180a29');
        bgGrad.addColorStop(1, '#240d38');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        stars.forEach(s => {
            ctx.globalAlpha = Math.sin(elapsedTime * 2 + s.alpha * 10) * 0.5 + 0.5;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;
    }

    function drawUI() {
        ctx.textAlign = "center";
        ctx.fillStyle = "#FFFFFF";

        if (gameState === "START") {
            ctx.shadowColor = "#a29bfe";
            ctx.shadowBlur = 12;
            ctx.font = "bold 24px 'Segoe UI', Arial";
            ctx.fillText("BAŞLAMAK İÇİN TIKLA", canvas.width / 2, canvas.height / 2 - 30);
        } else if (gameState === "GAMEOVER") {
            ctx.shadowColor = "#e84118";
            ctx.shadowBlur = 15;
            ctx.font = "bold 34px 'Segoe UI', Arial";
            ctx.fillStyle = "#ff7675";
            ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 50);

            let symbol = getRankSymbol(score);
            ctx.shadowColor = "#f1c40f";
            ctx.shadowBlur = 10;
            ctx.font = "bold 22px 'Segoe UI', Arial";
            ctx.fillStyle = "#FFF";
            ctx.fillText(symbol + " Skor: " + score, canvas.width / 2, canvas.height / 2 - 5);

            ctx.shadowBlur = 0;
            ctx.font = "15px 'Segoe UI', Arial";
            ctx.fillStyle = "#a6b0c3";
            ctx.fillText("Yeniden Başlamak İçin Boşluk / Tıkla", canvas.width / 2, canvas.height / 2 + 40);
        } else if (gameState === "PLAY") {
            ctx.shadowColor = "#9b59b6";
            ctx.shadowBlur = 12;
            ctx.font = "bold 44px 'Segoe UI', Arial";
            ctx.fillText(score, canvas.width / 2, 70);
            ctx.shadowBlur = 0;

            let heartsText = "";
            for (let i = 0; i < playerLives; i++) heartsText += "❤️ ";
            ctx.font = "18px 'Segoe UI', Arial";
            ctx.textAlign = "left";
            ctx.fillStyle = "#ff4757";
            ctx.fillText(heartsText, 20, 35);

            let activePowerUpsText = [];
            if (doubleScoreTimer > 0) activePowerUpsText.push(`⚡ 2X Puan: ${Math.ceil(doubleScoreTimer)}s`);

            if (activePowerUpsText.length > 0) {
                ctx.font = "bold 14px 'Segoe UI', Arial";
                ctx.textAlign = "left";
                let startX = 20;
                let startY = 65;
                activePowerUpsText.forEach((txt, idx) => {
                    ctx.fillStyle = "#f1c40f";
                    ctx.fillText(txt, startX, startY + (idx * 20));
                });
            }
        }
    }

    function gameOver() {
        if (gameState !== "GAMEOVER") {
            gameState = "GAMEOVER";
            
            totalCoins += score;
            saveAccountData();

            if (!scoreSaved) {
                scoreSaved = true;
                saveScoreToFirebase(playerNick, score);
            }
        }
    }

    function resetGame() {
        bird.reset();
        pipes.reset();
        score = 0;
        scoreSaved = false;
        pipeTimer = 0;
        updateProgressData(0);
        gameState = "PLAY";
        bird.flap();
    }

    function handleAction() {
        if (gameState === "START") {
            gameState = "PLAY";
            bird.flap();
        } else if (gameState === "PLAY") {
            bird.flap();
        } else if (gameState === "GAMEOVER") {
            resetGame();
        }
    }

    document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && gameState !== "WAITING_LOGIN") {
            handleAction();
        }
    });

    canvas.addEventListener("click", () => {
        if (gameState !== "WAITING_LOGIN") handleAction();
    });

    let lastTime = performance.now();

    function loop(currentTime) {
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        if (dt > 0.1) dt = 0.1;
        let factor = dt * 60;

        elapsedTime += dt;

        drawBackground();
        pipes.update(factor, dt);
        pipes.draw();
        ground.draw();
        bird.update(factor);
        bird.draw();
        drawUI();

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
